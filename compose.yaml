x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://payments:${POSTGRES_PASSWORD:-payments-local}@db:5432/payments
    NODE_ENV: development
  init: true
  stop_grace_period: 45s

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payments-local}
      POSTGRES_DB: payments
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments -d payments']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ['node', 'dist/infrastructure/database/migrate.js']
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    profiles: ['card']
    command: ['node', 'dist/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
